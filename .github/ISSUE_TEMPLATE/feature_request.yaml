name: Feature Request
description: Suggest a new feature for SkinRestorer
title: "[Feature Request]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        💡 **Before submitting:**
        - Check existing feature requests for duplicates
        - Be clear and concise
        - Explain the *why* and the *how*

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: Detailed description of the feature
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature needed? What problem does it solve?
    validations:
      required: true

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: How would this feature be used and who would benefit?
    validations:
      required: true

  - type: textarea
    id: implementation-ideas
    attributes:
      label: Implementation Ideas (Optional)
      description: Any thoughts on how it could be implemented?
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I've checked for existing feature requests
          required: true
